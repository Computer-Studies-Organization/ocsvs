name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup env files for CI
        run: |
          cp apps/frontend/.env.example apps/frontend/.env
          cp apps/backend/.env.example apps/backend/.env

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Test
        run: pnpm -w test

      - name: Build
        run: pnpm -w build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @cso-voting/e2e exec playwright install --with-deps chromium

      - name: Setup env files for CI
        run: |
          cp apps/frontend/.env.example apps/frontend/.env
          cp apps/backend/.env.example apps/backend/.env
          sed -i "s|^TURSO_DATABASE_URL=.*|TURSO_DATABASE_URL=http://127.0.0.1:8080|" apps/backend/.env
          sed -i "s|^TURSO_AUTH_TOKEN=.*|TURSO_AUTH_TOKEN=local_dummy_token|" apps/backend/.env

      - name: Build frontend assets for Wrangler
        run: pnpm --filter @cso-voting/frontend build

      - name: Run E2E Tests
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          ~/.turso/turso dev --db-file ${{ github.workspace }}/apps/backend/local.db --port 8080 &
          sleep 2
          pnpm --filter @cso-voting/backend db:migrate
          pnpm test:e2e
        env:
          FULL_MATRIX: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
